<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NASA Space Explorer</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather+Sans:wght@500;700&display=swap" rel="stylesheet">

  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div class="starfield"></div>
  <img src="img/nasa-worm-logo.png" alt="NASA Logo" class="logo" />

  <div class="container">
    <header class="site-header">
      <p class="catchphrase">Astronomy Picture of the Day</p>
      <h1>✦ Space Explorer ✦</h1>
      <p class="page-instructions">Select a date range and click "Get Space Images" to explore the cosmos!</p>
    </header>

    <div class="filters">
      <div class="date-field">
        <label for="startDate">From</label>
        <input type="date" id="startDate">
      </div>
      
      <div class="date-field">
        <label for="endDate">To</label>
        <input type="date" id="endDate">
      </div>
      
      <button id="exploreBtn">✦ Explore</button>
    </div>

    <div id="spaceFact" class="space-fact">
      <h2>Did You Know?</h2>
      <p id="factText"></p>
      <button id="newFactButton" class="new-fact-button">
        ✦ New Fact
      </button>
    </div>

    <div id="gallery" class="gallery"></div>
  </div>

  <!-- Modal -->
  <div id="imageModal" class="modal">
  <div class="modal-content">
    <button id="closeModal" class="close-button">&times;</button>

    <img id="modalImage" src="" alt="">

    <div class="modal-text">
      <h2 id="modalTitle"></h2>
      <p id="modalDate"></p>
      <p id="modalExplanation"></p>
    </div>
  </div>
</div>

  <script src="js/dateRange.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
